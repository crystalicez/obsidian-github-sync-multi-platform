name: GitHub E2E Live

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-e2e-live
  cancel-in-progress: false

jobs:
  qualify:
    name: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-e2e
    env:
      GITHUB_E2E_OWNER: ${{ vars.E2E_OWNER }}
      GITHUB_E2E_REPO: ${{ vars.E2E_REPO }}
      GITHUB_E2E_TOKEN: ${{ secrets.E2E_TOKEN }}
      GITHUB_E2E_BRANCH: obsidian-sync-e2e/run-${{ github.run_id }}
    steps:
      - name: Guard qualification target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          test -n "$GITHUB_E2E_OWNER"
          test -n "$GITHUB_E2E_REPO"
          test -n "$GITHUB_E2E_TOKEN"
          test "$GITHUB_E2E_OWNER/$GITHUB_E2E_REPO" != "$GITHUB_REPOSITORY"
          current_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          test "$current_master" = "$GITHUB_SHA"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run real GitHub E2E
        run: pnpm test:github-e2e:quick

      - name: Write qualification audit manifest
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync("github-e2e-qualification.json", JSON.stringify({
            schemaVersion: 1,
            commitSha: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            qualifiedAt: new Date().toISOString(),
            suite: "github-e2e-quick",
          }, null, 2) + "\n");
          NODE

      - name: Upload qualification audit manifest
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-e2e-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: github-e2e-qualification.json
          if-no-files-found: error

  cleanup:
    name: cleanup
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-e2e
    env:
      E2E_OWNER: ${{ vars.E2E_OWNER }}
      E2E_REPO: ${{ vars.E2E_REPO }}
      E2E_TOKEN: ${{ secrets.E2E_TOKEN }}
      E2E_BRANCH: obsidian-sync-e2e/run-${{ github.run_id }}
    steps:
      - name: Delete and verify disposable branch
        run: |
          node - <<'NODE'
          const owner = process.env.E2E_OWNER;
          const repo = process.env.E2E_REPO;
          const token = process.env.E2E_TOKEN;
          const branch = process.env.E2E_BRANCH;
          if (!owner || !repo || !token || !branch) throw new Error("Missing E2E cleanup configuration.");
          const encodedBranch = branch.split("/").map(encodeURIComponent).join("/");
          const url = `https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${encodedBranch}`;
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let attempt = 1; attempt <= 3; attempt++) {
            const before = await fetch(url, { headers });
            if (before.status === 404) process.exit(0);
            await before.arrayBuffer();
            const deleted = await fetch(url, { method: "DELETE", headers });
            await deleted.arrayBuffer();
            const verify = await fetch(url, { headers });
            await verify.arrayBuffer();
            if (verify.status === 404) process.exit(0);
            if (attempt < 3) await sleep(attempt * 2_000);
          }
          throw new Error(`Disposable E2E branch still exists after cleanup attempts: ${branch}`);
          NODE
