name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Fast tests
        run: pnpm test
      - name: Repeat fast tests
        run: pnpm test:repeat
      - name: Recovery tests
        run: pnpm test:recovery
      - name: Resource tests
        run: pnpm test:resource
      - name: Feasibility tests
        run: pnpm test:feasibility
      - name: Validate package
        run: pnpm validate:package
      - name: Upload tested plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
