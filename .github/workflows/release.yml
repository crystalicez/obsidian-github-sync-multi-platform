name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release (x.y.z)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  NAME: ${{ github.event.repository.name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Block stable release until Child A provenance gate lands
        run: |
          echo "Stable Release is temporarily disabled until the approved Release Provenance and Versioning (Child A) implementation replaces the legacy qualification/publication path." >&2
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release target and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/heads/master"
          test "$(jq -r .version manifest.json)" = "$VERSION"
          test "$(jq -r .version package.json)" = "$VERSION"
          min_app=$(jq -r .minAppVersion manifest.json)
          test "$(jq -r --arg version "$VERSION" '.[$version]' versions.json)" = "$min_app"
          current_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          test "$current_master" = "$GITHUB_SHA"
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "Stable tag already exists: $VERSION" >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $VERSION" >&2
            exit 1
          fi
          highest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$highest" ]; then
            CURRENT_VERSION="$highest" TARGET_VERSION="$VERSION" node - <<'NODE'
          const current = process.env.CURRENT_VERSION.split(".").map(Number);
          const target = process.env.TARGET_VERSION.split(".").map(Number);
          let comparison = 0;
          for (let index = 0; index < 3; index++) {
            if (target[index] !== current[index]) {
              comparison = target[index] - current[index];
              break;
            }
          }
          if (comparison <= 0) {
            console.error(`Release version ${process.env.TARGET_VERSION} must be greater than ${process.env.CURRENT_VERSION}`);
            process.exit(1);
          }
          NODE
          fi

      - name: Require exact-SHA live GitHub qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          qualified=false
          mapfile -t run_ids < <(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/github-e2e-live.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "master" and .head_sha == env.GITHUB_SHA) | .id')
          for run_id in "${run_ids[@]}"; do
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
            qualify_count=$(jq '[.jobs[] | select(.name == "qualify" and .conclusion == "success")] | length' <<<"$jobs")
            cleanup_count=$(jq '[.jobs[] | select(.name == "cleanup" and .conclusion == "success")] | length' <<<"$jobs")
            if [ "$qualify_count" -ge 1 ] && [ "$cleanup_count" -ge 1 ]; then
              echo "Using live qualification run $run_id for $GITHUB_SHA"
              qualified=true
              break
            fi
          done
          if [ "$qualified" != true ]; then
            echo "No successful exact-SHA GitHub E2E qualification with qualify+cleanup success for $GITHUB_SHA" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Fast tests
        run: pnpm test

      - name: Repeat fast tests
        run: pnpm test:repeat

      - name: Recovery tests
        run: pnpm test:recovery

      - name: Resource tests
        run: pnpm test:resource

      - name: Feasibility tests
        run: pnpm test:feasibility

      - name: Compile real GitHub E2E harness
        run: pnpm test:github-e2e:compile

      - name: Validate package
        run: pnpm validate:package

      - name: Recheck master immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          test "$current_master" = "$GITHUB_SHA"

      - name: Package plugin
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          rm -rf "$NAME"
          mkdir "$NAME"
          cp main.js manifest.json styles.css "$NAME/"
          ZIP_PATH="$NAME-v$VERSION.zip"
          zip -r "$ZIP_PATH" "$NAME"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Create stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            "$ZIP_PATH" main.js manifest.json styles.css
