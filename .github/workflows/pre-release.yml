name: Branch Candidate Build

on:
  push:
    branches-ignore:
      - master
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Fast tests
        run: pnpm test

      - name: Repeat fast tests
        run: pnpm test:repeat

      - name: Recovery tests
        run: pnpm test:recovery

      - name: Resource tests
        run: pnpm test:resource

      - name: Feasibility tests
        run: pnpm test:feasibility

      - name: Compile real GitHub E2E harness
        run: pnpm test:github-e2e:compile

      - name: Validate package
        run: pnpm validate:package

      - name: Upload candidate plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
